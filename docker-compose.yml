version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
#  Samriddhi Gyan LMS — Docker Compose
#  Services: client (React/Vite), server (Node/Express), mongo (MongoDB)
#
#  Usage:
#    Start all:    docker compose up --build
#    Stop all:     docker compose down
#    View logs:    docker compose logs -f
#    Rebuild one:  docker compose up --build server
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: samriddhi-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"           # Expose to host so you can use MongoDB Compass
    volumes:
      - mongo_data:/data/db     # Persist database across container restarts
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Node.js Server ───────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: samriddhi-server
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - ./server/.env           # Load all environment variables from .env
    environment:
      # Override MONGO_URI to use Docker service name instead of localhost
      - MONGO_URI=mongodb://mongo:27017/lms-project-samriddhi-gyan
    volumes:
      # Persist uploaded files (profile photos, course materials, etc.)
      - uploads_data:/app/uploads
      # Persist HLS video segments generated by FFmpeg
      - hls_data:/app/public/hls
    depends_on:
      mongo:
        condition: service_healthy  # Wait for MongoDB to be ready before starting
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Video Transcoder Server (Dedicated Microservice) ─────────────────────
  video-server:
    build:
      context: ./video-server
      dockerfile: Dockerfile
    container_name: samriddhi-video-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./video-server/.env
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── React Client (Vite Dev Server) ───────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: samriddhi-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    depends_on:
      - server                  # Start server first so API is available

# ═══════════════════════════════════════════════════════════════════════════
#  Named Volumes — Data persisted here survives container restarts/rebuilds
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  hls_data:
    driver: local
